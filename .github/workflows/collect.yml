name: Saatlik veri toplama

on:
  schedule:
    - cron: "0 * * * *"   # her saat başı (UTC). GitHub bazen birkaç dakika gecikebilir.
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veriyi çek
        run: python collect.py

      - name: HTML panoyu güncelle
        run: python dashboard.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/steam.db docs/index.html
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') ölçümü"
          git push
