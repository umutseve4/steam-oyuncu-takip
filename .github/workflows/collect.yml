name: Saatlik veri toplama

on:
  schedule:
    - cron: "0 * * * *"   # her saat başı (UTC). GitHub bazen birkaç dakika gecikebilir.
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
  repository_dispatch:     # API ile tetikleme (event_type: collect)
    types: [collect]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Oyuncu sayılarını çek
        run: python collect.py

      - name: Mağaza verisini çek (günde 1 kez)
        run: python store.py
        continue-on-error: true   # mağaza API'si hata verse bile pano güncellensin

      - name: SQL analizini çalıştır
        run: python analyze.py
        continue-on-error: true   # analiz hatası veri kaydını engellemesin

      - name: HTML panoyu güncelle
        run: python dashboard.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/steam.db docs/index.html
          [ -f reports/sql_analiz.md ] && git add -f reports/sql_analiz.md
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') ölçümü"
          git pull --rebase --quiet || true
          git push
